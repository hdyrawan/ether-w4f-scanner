name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with full extras
        run: |
          pip install --upgrade pip
          pip install .[full]
          pip install pytest
      - name: Run test suite
        run: python -m pytest -q

  minimal:
    name: pytest (no optional deps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package WITHOUT optional deps
        run: |
          pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Run non-crypto test suite
        # The integration tests need `cryptography` for the local TLS
        # server's self-signed cert. Everything else must pass without it.
        run: python -m pytest -q -k "not integration"

  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + version check
        run: |
          pip install .
          w4f --version
          w4f --help >/dev/null
          echo "smoke ok"
