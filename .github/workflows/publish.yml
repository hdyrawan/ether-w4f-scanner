name: publish

# Trusted publisher (OIDC) release to PyPI.
#
# PyPI's "pending publisher" for hdyrawan/w4f is configured for THIS
# workflow name (publish.yml) with environment "pypi", so:
#   - the file name must stay publish.yml (renaming it breaks publishing)
#   - the job must declare environment: pypi so the OIDC token carries
#     that environment claim (a missing environment does NOT match)
#   - no PYPI_TOKEN / TWINE_PASSWORD is ever needed — the OIDC exchange
#     below proves the identity of this workflow to PyPI directly.
#
# Trigger: push a version tag like `v0.1.10`:
#   git tag v0.1.10 && git push origin v0.1.10

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write   # required for the trusted-publisher OIDC exchange
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build + twine
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify the artifacts
        run: twine check dist/*
      - name: Run the test suite
        run: |
          pip install .[full]
          pip install pytest
          python -m pytest -q
      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
